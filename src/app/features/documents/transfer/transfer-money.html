@if (validationErrors().length > 0) {
  <div class="mb-4 rounded border border-red-300 bg-red-50 p-3">
    <div class="font-semibold text-red-700 mb-2">Validation errors</div>
    <ul class="list-disc ml-5 text-red-700">
      @for (error of validationErrors(); track error) {
        <li>{{ error }}</li>
      }
    </ul>
  </div>
}

<form class="max-w-4xl bg-white rounded-lg shadow p-3 space-y-2" (ngSubmit)="submit()">
  <!-- Transfer Header -->
  <div class="bg-white border border-gray-200 rounded-md shadow-sm p-2 mt-2">
    <h2 class="text-sm font-semibold text-gray-700 mb-1">Transfer Header</h2>
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-3">
        <label class="block text-xs font-medium mb-1">Transaction Date</label>
        <input type="date" name="transferDate" class="w-full border border-gray-300 rounded px-3 py-0.5"
        [ngModel]="draft()?.transferDate" (ngModelChange)="updateDraft({ transferDate: $event })"/>
      </div>
    </div>
  </div>

  <!-- Accounts -->
  <div class="bg-white border border-gray-200 rounded-md shadow-sm p-2 mt-2">
    <h2 class="text-sm font-semibold text-gray-700 mb-1">Accounts</h2>
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Source Account</label>
        <app-account-autocomplete (accountSelected)="onSourceAccountSelected($event)"/>
      </div>

      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Target Account</label>
        <app-account-autocomplete (accountSelected)="onTargetAccountSelected($event)"/>
      </div>

      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Payment Method</label>
        <select name="paymentMethod" class="w-full border border-gray-300 rounded px-3 py-0.5" [ngModel]="draft()?.paymentMethod" (ngModelChange)="updateDraft({ paymentMethod: $event })">
        @for (method of paymentMethods; track method) {
          <option [value]="method">{{ method }}</option>
        }
        </select>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-4 mt-3">
      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Source Currency</label>
        <input readonly class="w-full border border-gray-300 rounded px-3 py-0.5 bg-gray-100" tabindex="-1"
        [value]="draft()?.sourceAccount?.accountCurrency ?? ''">
      </div>

      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Target Currency</label>
        <input readonly class="w-full border border-gray-300 rounded px-3 py-0.5 bg-gray-100" tabindex="-1"
        [value]="draft()?.targetAccount?.accountCurrency ?? ''">
      </div>
    </div>
  </div>

  <!-- Amounts -->
  <div class="bg-white border border-gray-200 rounded-md shadow-sm p-2 mt-2">
    <h2 class="text-sm font-semibold text-gray-700 mb-1">Amounts</h2>

    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-3">
        <label class="block text-xs font-medium mb-1">Transfer Amount</label>
        <app-number-input inputName="transferAmount" ariaLabel="Transfer amount" 
          [value]="draft()?.transferAmount ?? null"
          [fractionDigits]="2" 
          [minimum]="0.01" 
          [required]="true"
          (valueChange)="updateDraft({ transferAmount: $event ?? 0 })">
        </app-number-input>
      </div>

      <div class="col-span-3">
        <label class="block text-xs font-medium mb-1">Exchange Rate</label>
        <app-number-input inputName="exchangeRate" ariaLabel="Exchange rate" 
          [value]="draft()?.exchangeRate ?? null"
          [fractionDigits]="6"
          [minimum]="0.000001"
          [required]="true"
          (valueChange)="updateDraft({ exchangeRate: $event ?? 1 })">
        </app-number-input>
      </div>

      <div class="col-span-3">
        <label class="block text-xs font-medium mb-1">Provision Amount</label>
        <app-number-input inputName="provisionAmount" ariaLabel="Provision amount" 
          [value]="draft()?.provisionAmount ?? null"
          [fractionDigits]="2" 
          [minimum]="0.00" 
          (valueChange)="updateDraft({ provisionAmount: $event ?? 0 })">
        </app-number-input>
      </div>

      <div class="col-span-3">
        <label class="block text-xs font-medium mb-1">Provision At</label>
        <select name="provisionAt" class="w-full border border-gray-300 rounded px-3 py-0.5"
        [ngModel]="draft()?.provisionAt" (ngModelChange)="updateDraft({ provisionAt: $event })">
          <option value="" selected>Select provision at...</option>
          <option value="SOURCE">Source</option>
          <option value="TARGET">Target</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Calculated Result -->
  <div class="bg-gray-50 font-semibold border border-gray-200 rounded-md shadow-sm p-2 mt-2">
    <h2 class="text-sm font-semibold text-gray-700 mb-1">Calculated Result</h2>

    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Withdrawn Amount</label>
        <input readonly class="w-full border border-gray-300 rounded px-3 py-0.5 bg-gray-100 text-right" tabindex="-1"
        [value]="formatAmount(getWithdrawnAmount())">
      </div>

      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Exchanged Amount</label>
        <input readonly class="w-full border border-gray-300 rounded px-3 py-0.5 bg-gray-100 text-right" tabindex="-1"
        [value]="formatAmount(getExchangedAmount())">
      </div>

      <div class="col-span-4">
        <label class="block text-xs font-medium mb-1">Received Amount</label>
        <input readonly class="w-full border border-gray-300 rounded px-3 py-0.5 bg-gray-100 text-right" tabindex="-1"
        [value]="formatAmount(getReceivedAmount())">
      </div>
    </div>
  </div>

  <!-- Comment -->
  <div class="bg-white border border-gray-200 rounded-md shadow-sm p-2 mt-2">
    <label class="block text-sm font-medium mb-2 text-gray-700">Comment</label>
    <textarea name="comment" rows="2" class="w-full border border-gray-300 rounded px-3 py-0.5 resize-y"
    [ngModel]="draft()?.comment" (ngModelChange)="updateDraft({ comment: $event })">
    </textarea>
  </div>

  <!-- Actions -->
  <div class="bg-white border border-gray-200 rounded-md shadow-sm p-2 mt-2">
    <div class="flex gap-2">
      <button type="button" class="px-4 py-1 border border-gray-300 rounded bg-white hover:bg-gray-50" (click)="resetForm()">Reset</button>
      <button type="submit" class="px-6 py-1 rounded bg-blue-600 text-white hover:bg-blue-700">Transfer Money</button>
    </div>
  </div>
</form>
