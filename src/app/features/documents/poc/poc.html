@if (validationErrors().length > 0) {
  <div class="mb-4 rounded border border-red-300 bg-red-50 p-3">
    <div class="font-semibold text-red-700 mb-2">Validation errors</div>
    <ul class="list-disc ml-5 text-red-700">
      @for (error of validationErrors(); track error) {
        <li>{{ error }}</li>
      }
    </ul>
  </div>
}

<form class="max-w-4xl bg-white rounded-lg shadow p-3 space-y-2" (ngSubmit)="submit()">

<div class="bg-white border border-gray-200 rounded-md shadow-sm p-4 mt-4">

  <!-- Header -->
  <h2 class="text-sm font-semibold text-gray-700 mb-4">Document Header</h2>
  <div class="grid grid-cols-12 gap-4">
    <div class="col-span-2">
      <label class="block text-xs font-medium mb-1">Date</label>
      <input type="date" name="documentDate" class="w-full border border-gray-300 rounded px-3 py-0.5" [ngModel]="draft()?.documentDate" (ngModelChange)="updateDraft({ documentDate: $event })" />
    </div>


    <div class="col-span-2">
      <label class="block text-xs font-medium mb-1">Type</label>
      <select name="documentType" class="w-full border border-gray-300 rounded px-3 py-0.5" [ngModel]="draft()?.documentType" (ngModelChange)="updateDraft({ documentType: $event })">
        @for (type of documentTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </div>

    <div class="col-span-5">
      <label class="block text-xs font-medium mb-1">Document name</label>
      <app-document-name-autocomplete (nameChanged)="onDocumentNameChanged($event)"/>
    </div>

    <div class="col-span-3">
      <label class="block text-xs font-medium mb-1">Invoice Number</label>
      <input type="text" name="invoiceNumber" class="w-full border border-gray-300 rounded px-3 py-0.5 disabled:bg-gray-100 disabled:text-gray-400"
        [disabled]="!isInvoiceNumberEnabled()" [ngModel]="draft()?.invoiceNumber" (ngModelChange)="updateDraft({ invoiceNumber: $event })" />
    </div>
  </div>

  <div class="grid grid-cols-12 gap-4 mt-3">
    <div class="col-span-4">
      <label class="block text-xs font-medium mb-1">Account name</label>
      <app-account-autocomplete (accountSelected)="onAccountSelected($event)" />
    </div>
  
    <div class="col-span-8">
      <label class="text-xs font-medium">Counterparty</label>
      <app-counterparty-autocomplete [disabled]="!isCounterpartyEnabled()" (counterpartySelected)="onCounterpartySelected($event)" />
    </div>
  </div>

  <div class="grid grid-cols-12 gap-4 mt-3">
    <div class="col-span-5">
      <label class="block text-xs font-medium mb-1">Payment Method</label>
      <select name="paymentMethod" class="w-full border border-gray-300 rounded px-3 py-0.5" [ngModel]="draft()?.paymentMethod" (ngModelChange)="updateDraft({ paymentMethod: $event })">
        @for (method of paymentMethods; track method) {
          <option [value]="method">{{ method }}</option>
        }
      </select>
    </div>
  
    <div class="col-span-3">
      <label class="block text-xs font-medium mb-1">Currency</label>
      <select name="currencyCode" class="w-full border border-gray-300 rounded px-3 py-0.5" [ngModel]="draft()?.currencyCode" (ngModelChange)="onCurrencyChange($event)">
        @for (currency of currencies; track currency) {
          <option [value]="currency">{{ currency }}</option>
        }
      </select>
    </div>

    <div class="col-span-4">
      <label class="block text-xs font-medium mb-1">Exchange Rate</label>
      <app-number-input 
      inputName="exchangeRate"       
      [value]="draft()?.exchangeRate ?? null"
      [fractionDigits]="6" 
      [minimum]="0.000001" 
      [required]="true" 
      [readonly]="!isExchangeRateEditable()" 
      (valueChange)="updateDraft({ exchangeRate: $event ?? 1 })" 
      ariaLabel="Exchange rate"/>
    </div>
  </div>

  <!-- Item Section -->
  <div class="rounded border border-gray-200 mt-2 p-2">
    <h3 class="text-sm font-semibold text-gray-700 mb-2">Document Item</h3>
  
    <!-- Header Row -->
    <div class="grid grid-cols-12 gap-2 text-xs font-semibold text-gray-700 bg-gray-100 border border-gray-200 rounded px-2 pt-1">
      <div class="col-span-2">Type</div>
      <div class="col-span-4">Item</div>
      <div class="col-span-1 text-right">Qty</div>
      <div class="col-span-2 text-right">Unit Price</div>
      <div class="col-span-3 text-right">Total</div>
    </div>
  
    <!-- Input Row -->
    <div class="grid grid-cols-12 gap-2 mt-1">
      <div class="col-span-2">
        <select name="documentItemType" class="w-full border border-gray-300 rounded px-3 py-0.5" required [ngModel]="draft()?.documentItems?.[0]?.itemType" (ngModelChange)="updateDocumentItem({ itemType: $event })">
          <option value="">Select type</option>
          <option value="EXP">Expense</option>
          <option value="INC">Income</option>
        </select>
      </div>
  
      <div class="col-span-4">
        <app-item-autocomplete (itemSelected)="onItemSelected($event)" />
      </div>
  
      <div class="col-span-1">
        <app-number-input
        inputName="documentItemQuantity"
        [value]="draft()?.documentItems?.[0]?.itemQuantity ?? null"
        [fractionDigits]="3"
        [minimum]="0.001"
        [required]="true"
        (valueChange)="updateDocumentItem({ itemQuantity: $event ?? 0 })"
        ariaLabel="Document item quantity"/>
      </div>
  
      <div class="col-span-2">
        <app-number-input inputName="documentItemPrice" 
        [value]="draft()?.documentItems?.[0]?.itemPrice ?? null"
        [fractionDigits]="2"
        [minimum]="0.01"
        [required]="true"
        (valueChange)="updateDocumentItem({ itemPrice: $event ?? 0 })"
        placeholder="Price"
        ariaLabel="Document item price"/>
      </div>
  
      <div class="col-span-3">
        <input readonly class="w-full border border-gray-300 rounded px-3 py-0.5 bg-gray-100 text-right font-medium" [value]="getOriginalTotal()" />
      </div>
    </div>
  
    <!-- Comment Row -->
    <div class="mt-3">
      <label class="block text-xs font-semibold text-gray-700 mb-1">Item Comment</label>
      <app-item-comment-autocomplete (commentChanged)="onCommentChanged($event)"/>
    </div>
  </div>
</div>

<!-- Document Comment Panel -->
<div class="bg-white border border-gray-200 rounded p-4 mt-4">
  <label class="block text-sm font-medium mb-2 text-gray-700">Document Comment</label>
  <textarea rows="5" name="documentComment" class="w-full border border-gray-300 rounded px-3 py-0.5 resize-y"
    [ngModel]="draft()?.documentComment" (ngModelChange)="updateDraft({documentComment: $event})">
    </textarea>
</div>

<!-- Action Panel -->
<div class="bg-white border border-gray-200 rounded p-4 mt-4">
  <div class="flex gap-2">
    <button type="button" class="px-4 py-1 border border-gray-300 rounded bg-white hover:bg-gray-50" (click)="resetForm()">Reset</button>
    <button type="button" class="px-4 py-1 border border-gray-300 rounded bg-white hover:bg-gray-50 " disabled>Save Draft</button>
    <button type="submit" class="px-6 py-1 rounded bg-blue-600 text-white hover:bg-blue-700">Create Document</button>
  </div>
</div>
</form>
