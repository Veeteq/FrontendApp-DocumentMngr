<div class="mt-2 rounded-md border border-gray-200 bg-white p-2 shadow-sm">
  <h2 class="mb-2 text-sm font-semibold text-gray-700">Money Transfer</h2>

  <!-- Accounts -->
  <div class="grid grid-cols-12 gap-4">
    <div class="col-span-4">
      <label class="mb-1 block text-xs font-medium">Source Account</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"
        [value]="transfer().sourceAccount.accountName" />
    </div>

    <div class="col-span-2">
      <label class="mb-1 block text-xs font-medium">Source Currency</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"
        [value]="transfer().sourceCurrency" />
    </div>

    <div class="col-span-4">
      <label class="mb-1 block text-xs font-medium">Target Account</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"
        [value]="transfer().targetAccount.accountName" />
    </div>

    <div class="col-span-2">
      <label class="mb-1 block text-xs font-medium">Target Currency</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"
        [value]="transfer().targetCurrency" />
    </div>
  </div>

  <!-- Amounts -->
  <div class="mt-3 grid grid-cols-12 gap-4">
    <div class="col-span-6">
      <label class="mb-1 block text-xs font-medium">Outgoing Amount</label>      
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5 text-right font-semibold"
        [value]="formatAmountWithCurrency(transfer().sourceAmount, transfer().sourceCurrency)" />
    </div>

    <div class="col-span-6">
      <label class="mb-1 block text-xs font-medium">Incoming Amount</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5 text-right font-semibold"
        [value]="formatAmountWithCurrency(transfer().targetAmount, transfer().targetCurrency)" />
    </div>
  </div>

  <!-- Exchange Rates -->
  @if (hasDifferentCurrencies()) {
    <div class="mt-3 grid grid-cols-12 gap-4">
      <div class="col-span-6">
        <label class="mb-1 block text-xs font-medium">
          {{ transfer().sourceCurrency }} → {{ transfer().targetCurrency }} Rate
        </label>

        <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5 text-right"
          [value]="formatRate(sourceToTargetRate())" />

        <div class="mt-1 text-xs text-gray-500">
          1 {{ transfer().sourceCurrency }} = {{ formatRate(sourceToTargetRate()) }} {{ transfer().targetCurrency }}
        </div>
      </div>

      <div class="col-span-6">
        <label class="mb-1 block text-xs font-medium">
          {{ transfer().targetCurrency }} → {{ transfer().sourceCurrency }} Rate
        </label>

        <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5 text-right"
          [value]="formatRate(targetToSourceRate())" />

        <div class="mt-1 text-xs text-gray-500">
          1 {{ transfer().targetCurrency }} = {{ formatRate(targetToSourceRate()) }} {{ transfer().sourceCurrency }}
        </div>
      </div>
    </div>
  }

  <!-- Transfer Method -->
  <div class="mt-3 grid grid-cols-12 gap-4">
    <div class="col-span-6">
      <label class="mb-1 block text-xs font-medium">Transfer Method</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"
        [value]="document().paymentMethod" />
    </div>
  </div>
</div>
