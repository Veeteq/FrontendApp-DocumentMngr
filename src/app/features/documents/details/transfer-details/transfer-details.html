<!-- Accounts panel -->                                                                                                           
<div class="mt-2 rounded-md border border-gray-200 bg-white p-2 shadow-sm">                                                       
  <h2 class="mb-2 text-sm font-semibold text-gray-700">Money Transfer</h2>                                                       
  <div class="grid grid-cols-12 gap-4">                                                                                           
    <div class="col-span-4">                                                                                                      
      <label class="mb-1 block text-xs font-medium">Source Account</label>                                                        
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"                         
        [value]="document().account.accountName" />                                                                          
    </div>                                                                                                                        
                                                                                                                                  
    <div class="col-span-2">                                                                                                      
      <label class="mb-1 block text-xs font-medium">Source Currency</label>                                                       
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"                         
        [value]="document().account.accountCurrency" />                                                                      
    </div>                                                                                                                        
                                                                                                                                  
    <div class="col-span-4">                                                                                                      
      <label class="mb-1 block text-xs font-medium">Target Account</label>                                                        
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"                         
        [value]="document().targetAccount?.accountName ?? ''" />                                                             
    </div>                                                                                                                        
                                                                                                                                  
    <div class="col-span-2">                                                                                                      
      <label class="mb-1 block text-xs font-medium">Target Currency</label>                                                       
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"                         
        [value]="document().targetAccount?.accountCurrency ?? ''" />                                                         
    </div>                                                                                                                        
  </div>                                                                                                                          
</div>                                                                                                                           

<!-- Payment / transfer information -->
<div class="mt-2 rounded-md border border-gray-200 bg-white p-2 shadow-sm">
  <h2 class="mb-2 text-sm font-semibold text-gray-700">Transfer Information</h2>

  <div class="grid grid-cols-12 gap-4">
    <div class="col-span-4">
      <label class="mb-1 block text-xs font-medium">Payment Method</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"
        [value]="document().paymentMethod" />
    </div>

    <div class="col-span-2">
      <label class="mb-1 block text-xs font-medium">Currency</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5"
        [value]="document().currencyCode" />
    </div>

    <div class="col-span-3">
      <label class="mb-1 block text-xs font-medium">Exchange Rate</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5 text-right"
        [value]="formatAmount(document().exchangeRate, 6)" />
    </div>

    <div class="col-span-3">
      <label class="mb-1 block text-xs font-medium">Document Amount</label>
      <input readonly tabindex="-1" class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-0.5 text-right font-semibold"
        [value]="formatAmount(document().documentAmount)" />
    </div>
  </div>
</div>
