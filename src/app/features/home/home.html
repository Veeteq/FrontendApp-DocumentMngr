<header class="top-bar">
  @if (!auth.isAuthenticated()) {
    <button routerLink="/login">Login</button>
  } @else {
    <button (click)="auth.clearAccessToken()">Logout</button>
  }
</header>

<section class="hero-background">

  <!-- Content ~1/3 from the top -->
  <div class="hero-content">
    <h1>Home Budget Manager</h1>
    <p>Track documents, events, and your spending — all in one place.</p>
  </div>

  <!-- Features ~1/4 from the bottom -->
  @if (auth.isAuthenticated()) {
    <section class="features">
      <div class="feature">📄 Documents</div>
      <div class="feature">💰 Accounts</div>
      <div class="feature">📊 Dashboard</div>
    </section>
}
