<div class="relative">

  <label class="block text-sm font-medium mb-1 disabled:text-gray-400">Counterparty</label>

  <input type="text" role="combobox" class="w-full border rounded px-3 py-0.5 disabled:bg-gray-100 disabled:text-gray-400" placeholder="Counterparty name"
  aria-autocomplete="list" [aria-expanded]="opened()" aria-haspopup="listbox" aria-controls="counterparties-list"
  [ngModel]="searchText()"   
  (ngModelChange)="onInput($event)" 
  [disabled]="disabled()"
  (blur)="hideDropdown()"
  (keydown)="onKeyDown($event)"/>

  @if (loading()) {
    <div class="absolute z-10 w-full bg-white rounded mt-1 p-2 text-sm">Searching...</div>
  }

  @if (opened()) {
    <div class="absolute z-50 w-full bg-white border rounded mt-1 shadow max-h-60 overflow-auto">
      @if (counterparties().length === 0) {
        <div class="px-3 py-2 text-sm text-gray-500 italic">Nothing found</div>
      }

      @for (counterparty of counterparties(); track counterparty.id; let index = $index) {
        <button type="button" class="block w-full text-left px-3 py-0.5 text-sm hover:bg-gray-100 border-b border-gray-100" 
        [class.bg-green-100]="highlightedIndex() === index"
        (click)="selectCounterparty(counterparty)">
          {{ counterparty.displayName }}
        </button>
      }
    </div>
  }
</div>
